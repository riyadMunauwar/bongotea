# OpenLiteSpeed virtual host rewrite rules.
#
# ⚠ UNTESTED. Treat this as a starting point that is known to be *nearly*
# identical to the Apache rules in public/.htaccess, which are the tested ones,
# rather than as a configuration that is known to work.
#
# OpenLiteSpeed does not read .htaccess by default, which is the whole reason
# this file exists.
#
# ── The short route ──────────────────────────────────────────────────────────
# Turn on .htaccess loading and the tested Apache rules apply as they are:
#
#     rewrite {
#       enable                  1
#       autoLoadHtaccess        1
#     }
#
# Prefer that. It leaves one set of rules to maintain instead of two.
#
# ── The explicit route ───────────────────────────────────────────────────────
# If .htaccess loading is off, paste the block below into the virtual host
# configuration, or into WebAdmin → Virtual Hosts → Rewrite → Rewrite Rules.
# The targets are rooted (`/index.php` rather than `index.php`) because these
# run at the virtual host, where there is no directory to resolve against.

rewrite  {
  enable                  1
  logLevel                0

  rules                   <<<END_rules
  RewriteCond %{REQUEST_FILENAME} !-d
  RewriteCond %{REQUEST_URI} (.+)/$
  RewriteRule ^ %1 [L,R=301]

  RewriteCond %{REQUEST_FILENAME} !-d
  RewriteCond %{REQUEST_FILENAME} !-f
  RewriteRule ^ /index.php [L]
  END_rules
}
