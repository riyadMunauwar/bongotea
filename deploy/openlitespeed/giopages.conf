# giopages — OpenLiteSpeed virtual host rewrite rules.
#
# ⚠ UNTESTED. Every other configuration in deploy/ has been run; this one has
# not. The project verifies nothing in CI here — three webservers cannot be —
# and an OpenLiteSpeed install is rare enough that it has not been exercised by
# hand either. Treat this as a starting point that is known to be *nearly*
# identical to the Apache rules in public/.htaccess, which are the tested ones,
# rather than as a configuration that is known to work. If it misbehaves, the
# fallback reader in app/Support/PageCache still serves the cache from PHP, so
# the failure mode is slower pages rather than broken ones.
#
# OpenLiteSpeed does not read .htaccess by default, which is the whole reason
# this file exists. An OpenLiteSpeed merchant is on a VPS by definition and can
# paste vhost configuration; a merchant on shared hosting never sees this file.
#
# ── The short route ──────────────────────────────────────────────────────────
# Turn on .htaccess loading and the tested Apache rules apply as they are:
#
#     rewrite {
#       enable                  1
#       autoLoadHtaccess        1
#     }
#
# Prefer that. It leaves one set of rules to maintain instead of two.
#
# ── The explicit route ───────────────────────────────────────────────────────
# If .htaccess loading is off — some operators keep it off for the per-request
# stat it costs — paste the block below into the virtual host configuration, or
# into WebAdmin → Virtual Hosts → Rewrite → Rewrite Rules.
#
# The rule order is the one every configuration here shares: trailing-slash
# canonicalisation, the direct-access lock, the real-file check, the cache
# lookup, then the front controller.
#
# The rules below are the ones in public/.htaccess with their targets rooted —
# `/page-cache/$1.html` rather than `page-cache/$1.html`. That is the one
# difference, and it is not cosmetic: .htaccess rules run per-directory, where a
# relative target resolves against the directory holding the file, while these
# run at the virtual host, where there is no such directory to resolve against.

rewrite  {
  enable                  1
  logLevel                0

  rules                   <<<END_rules
  # Cache entries are keyed on the path alone, so /promo/ would look up
  # "page-cache/promo/.html" and miss forever.
  RewriteCond %{REQUEST_FILENAME} !-d
  RewriteCond %{REQUEST_URI} (.+)/$
  RewriteRule ^ %1 [L,R=301]

  # The cache is under the document root, so each page is reachable a second
  # time as /page-cache/<slug>.html. The lock reads the decoded, normalised
  # path the server resolved rather than the characters the client typed, so no
  # spelling of the address gets past it. Our own rewrite is served either way:
  # it sits below the lock, so a ruleset evaluated in one pass — which is what
  # vhost scope gives you — never re-checks it, and REDIRECT_STATUS is empty
  # only on a request as it came off the wire, so a ruleset that does re-enter
  # itself passes on the second visit. Narrower than nginx's `internal`, which
  # cannot be spelled around at all, but it covers what the cache needs: one
  # address per Page.
  RewriteCond %{ENV:REDIRECT_STATUS} ^$
  RewriteCond %{REQUEST_URI} ^/+page-cache(/|$) [NC]
  RewriteRule ^ - [F,L]

  # The Site Root, which must stay ABOVE the -d rule below: "/" resolves to the
  # document root, a directory, so that rule matches it and stops rewriting.
  # Placed below, this silently does nothing.
  #
  # The root has no slug to be keyed on and no webserver can read a merchant's
  # settings, so it answers to a constant (ADR-0023). _front is unspellable as
  # a slug. Existence is still the contract: no file, no front page, and the
  # application decides and caches whichever document it drew.
  RewriteCond %{REQUEST_METHOD} ^(GET|HEAD)$
  RewriteCond %{DOCUMENT_ROOT}/page-cache/_front.html -f
  RewriteRule ^/?$ /page-cache/_front.html [L]

  # A real file — an asset — is served as it is and never reaches the cache
  # lookup. A directory stops here too, which is how / falls through to PHP
  # when nothing has been cached for it above.
  RewriteCond %{REQUEST_FILENAME} -f [OR]
  RewriteCond %{REQUEST_FILENAME} -d
  RewriteRule ^ - [L]

  # The cache lookup, query-blind by construction and restricted to the
  # methods a static file can honestly answer: without the method check, a
  # POST to a checkout sharing a page's slug would be answered from disk.
  RewriteCond %{REQUEST_METHOD} ^(GET|HEAD)$
  RewriteCond %{DOCUMENT_ROOT}/page-cache/$1.html -f
  RewriteRule ^(.+)$ /page-cache/$1.html [L]

  RewriteCond %{REQUEST_FILENAME} !-d
  RewriteCond %{REQUEST_FILENAME} !-f
  RewriteRule ^ /index.php [L]
  END_rules
}
