# giopages — production nginx server block.
#
# The cache contract: a request for a published landing page is answered by
# nginx reading one file off disk. PHP is not contacted — Laravel *writes* the
# file (on a miss) and *deletes* it (on a save).
#
# The application does carry a cache-read code path of its own:
# FallbackPageCacheReader runs above the Composer autoloader and serves the file
# itself for a merchant whose webserver was never configured to, which is most
# shared hosting. With this server block in place it never executes on a cache
# hit, because the request never reaches PHP. See app/Support/PageCache.

# The cache is only ever consulted for methods that a static file can honestly
# answer. Anything else is pointed at a directory that will never exist, so
# try_files falls straight through to PHP.
#
# Without this, POST /checkout would match a cached /checkout.html and nginx
# would answer 405 Not Allowed instead of routing to the application.
map $request_method $page_cache_dir {
    default  "/__page_cache_bypass";
    GET      "/page-cache";
    HEAD     "/page-cache";
}

server {
    listen 80;
    listen [::]:80;
    server_name giopages.example;

    root /var/www/giopages/public;
    index index.php;
    charset utf-8;

    # Cache entries are keyed on the path alone, so a trailing slash would look
    # up "/page-cache/promo/.html" and miss forever. Canonicalise before the
    # lookup rather than writing a second copy under a second key.
    rewrite ^/(.*)/$ /$1 permanent;

    # Serve the pre-compressed sibling the writer produced instead of gzipping
    # the same bytes on every request. StaticPageCache writes .html and
    # .html.gz as a unit, so the two can never disagree.
    gzip_static on;
    gzip_vary   on;

    # Removes a stat() per request for the hot set. The validity window is a
    # staleness window too: an invalidated page can still be served for up to
    # this long, so it is deliberately short.
    open_file_cache          max=1000 inactive=20s;
    open_file_cache_valid    5s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    location / {
        # $uri never contains the query string, so this lookup is query-blind
        # by construction — which is the intent. /promo, /promo?fbclid=... and
        # /promo?utm_source=fb all resolve to one cached file.
        #
        # The site root is not cached: it has no slug to be keyed on, so "/"
        # matches the document root as a directory and falls through to PHP.
        try_files $uri $uri/ $page_cache_dir$uri.html /index.php?$query_string;
    }

    # The cache directory lives under the document root, so it is reachable
    # directly as /page-cache/promo.html. Nothing should link there; make the
    # canonical URL the only way in.
    location ^~ /page-cache {
        internal;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/giopages-access.log;
    error_log  /var/log/nginx/giopages-error.log;
}
