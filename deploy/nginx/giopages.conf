# Production nginx server block.

server {
    listen 80;
    listen [::]:80;
    server_name bongotea.example;

    root /var/www/bongotea/public;
    index index.php;
    charset utf-8;

    gzip      on;
    gzip_vary on;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/bongotea-access.log;
    error_log  /var/log/nginx/bongotea-error.log;
}
