# The app container's server block. TLS ends at Dokploy's Traefik in front
# of it, so this listens on plain HTTP and nothing outside the stack reaches
# it directly.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    client_max_body_size 25m;
    server_tokens off;

    gzip            on;
    gzip_vary       on;
    gzip_comp_level 5;
    gzip_types      text/css application/javascript application/json image/svg+xml;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Vite fingerprints every file it writes, so a name never changes meaning.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
