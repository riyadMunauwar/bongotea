; Production PHP settings for the app, worker and scheduler containers.

expose_php = Off
memory_limit = 256M
max_execution_time = 60

upload_max_filesize = 20M
post_max_size = 25M

; The image is immutable, so compiled scripts never need re-checking.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
